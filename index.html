<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Documentation API PRIOS E - Externalisée</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">

    <!-- On importe NOTRE logique JavaScript (L'attribut defer permet de ne pas bloquer le chargement de la page) -->
    <script src="app.js" defer></script>

</head>
<body>
    <div class="sidebar">
        <h4 class="text-white mb-4">PRIOS E - Navigation</h4>
        <div id="sidebar-content"></div>
    </div>
    
    <div class="content">
        <h1 class="mb-2">Documentation Interactive Web Services PRIOS E</h1>
        <p class="text-muted mb-4">Mise à jour de la documentation : <strong id="doc-date">Chargement...</strong></p>
        <p class="lead text-muted">Retrouvez l'intégralité des méthodes, types de données, champs obligatoires et commentaires.</p>

        <div id="error-container"></div>

        <div class="sticky-tabs-container">
            <ul class="nav nav-tabs" id="mainTabs" role="tablist">
            </ul>
        </div>

        <div class="tab-content" id="mainTabsContent">
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="usageModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
          <div class="modal-header bg-primary text-white">
            <h5 class="modal-title" id="usageModalLabel">Utilisation du type</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="usageModalBody" style="font-size: 1.05em;">
          </div>
        </div>
      </div>
    </div>
