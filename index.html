<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation API PRIOS E</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:,">
</head>
<body class="sidebar-right-collapsed">

    <!-- 1. VOLET GAUCHE : LISTE DES MÉTHODES -->
    <aside class="sidebar sidebar-left" id="leftSidebar">
        <div class="sidebar-header">
            <h5 class="mb-0 text-white fw-bold">Méthodes</h5>
            <small class="text-muted" id="methodsCount">0 méthode</small>
        </div>
        <div class="sidebar-content" id="methodsList">
            <!-- Injecté par app.js -->
        </div>
    </aside>

    <!-- Languette verticale gauche -->
    <button type="button" class="vertical-tab vertical-tab-left" id="leftTabBtn" onclick="toggleLeftSidebar()" title="Masquer / Afficher les méthodes">
        <span class="tab-indicator" id="leftTabIndicator">◀</span>
        <span class="tab-text">MÉTHODES</span>
    </button>

    <!-- 2. ZONE CENTRALE -->
    <main class="content-area">
        <!-- En-tête avec onglets figés -->
        <header class="sticky-tabs-container">
            <div class="d-flex justify-content-between align-items-center mb-2 px-2">
                <h4 class="mb-0 fw-bold text-dark">PRIOS E <span class="text-secondary fw-normal fs-6">| Web Services</span></h4>
                <div class="text-muted small">Date doc : <span id="doc-date" class="badge bg-secondary">...</span></div>
            </div>
            <ul class="nav nav-tabs" id="mainTabs" role="tablist">
                <!-- Onglets générés dynamiquement -->
            </ul>
        </header>

        <!-- Fil d'Ariane & Navigation de retour -->
        <nav aria-label="breadcrumb" id="breadcrumbContainer" class="mb-3 px-1"></nav>

        <div id="error-container"></div>

        <!-- Fiche centrale active (Méthode ou Type) -->
        <div id="activeContentContainer">
            <!-- Injecté par app.js -->
        </div>
    </main>

    <!-- Languette verticale droite -->
    <button type="button" class="vertical-tab vertical-tab-right" id="rightTabBtn" onclick="toggleRightSidebar()" title="Masquer / Afficher les types">
        <span class="tab-indicator" id="rightTabIndicator">◀</span>
        <span class="tab-text">TYPES DE DONNÉES</span>
    </button>

    <!-- 3. VOLET DROIT : LISTE COMPACTE DES TYPES -->
    <aside class="sidebar sidebar-right" id="rightSidebar">
        <div class="sidebar-header d-flex justify-content-between align-items-center">
            <div>
                <h5 class="mb-0 text-white fw-bold">Types de données</h5>
                <small class="text-muted" id="typesCount">0 type</small>
            </div>
            <button class="btn btn-sm btn-outline-secondary text-white py-0 px-2" onclick="toggleRightSidebar(false)">✕</button>
        </div>
        <div class="sidebar-content" id="typesList">
            <!-- Injecté par app.js -->
        </div>
    </aside>

    <!-- Fenêtre modale : Analyse d'impact -->
    <div class="modal fade" id="usageModal" tabindex="-1" aria-labelledby="usageModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content shadow">
                <div class="modal-header bg-dark text-white py-2">
                    <h5 class="modal-title fs-6" id="usageModalLabel">Utilisation du type</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="usageModalBody"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
