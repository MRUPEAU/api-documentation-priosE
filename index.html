<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Documentation API PRIOS E - Externalisée</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- On importe NOTRE logique JavaScript (L'attribut defer permet de ne pas bloquer le chargement de la page) -->
    <script src="app.js" defer></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
        }

        .sidebar {
            height: 100vh;
            overflow-y: auto;
            background-color: #212529;
            color: white;
            padding: 20px;
            position: fixed;
            width: 320px;
            z-index: 1000;
        }

            .sidebar a {
                color: #adb5bd;
                text-decoration: none;
                display: block;
                margin-bottom: 8px;
                font-size: 0.95em;
            }

                .sidebar a:hover {
                    color: #fff;
                    text-decoration: underline;
                }

        .content {
            margin-left: 320px;
            padding: 30px;
        }

        .card {
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 2px solid transparent;
            transition: border-color 0.5s ease;
        }

            .card.highlight {
                border-color: #0d6efd;
                box-shadow: 0 0 15px rgba(13, 110, 253, 0.3);
            }

        .type-link {
            cursor: pointer;
            color: #0d6efd;
            font-weight: bold;
            text-decoration: none;
        }

            .type-link:hover {
                text-decoration: underline;
            }

        h2 {
            color: #343a40;
            margin-top: 40px;
        }

        .sticky-tabs-container {
            position: sticky;
            top: 0;
            background-color: #f8f9fa;
            z-index: 900;
            padding-top: 15px;
            padding-bottom: 5px;
            margin-bottom: 25px;
            border-bottom: 1px solid #dee2e6;
        }

        .nav-tabs {
            border-bottom: none;
        }

            .nav-tabs .nav-link {
                color: #495057;
                font-weight: 500;
                border: none;
            }

                .nav-tabs .nav-link.active {
                    color: #0d6efd;
                    border-bottom: 3px solid #0d6efd;
                    background-color: transparent;
                }
    </style>
</head>
<body>
    <div class="sidebar">
        <h4 class="text-white mb-4">PRIOS E - Navigation</h4>
        <div id="sidebar-content"></div>
    </div>
    
    <div class="content">
        <h1 class="mb-2">Documentation Interactive Web Services PRIOS E</h1>
        <p class="text-muted mb-4">Mise à jour de la documentation : <strong id="doc-date">Chargement...</strong></p>
        <p class="lead text-muted">Retrouvez l'intégralité des méthodes, types de données, champs obligatoires et commentaires.</p>

        <div id="error-container"></div>

        <div class="sticky-tabs-container">
            <ul class="nav nav-tabs" id="mainTabs" role="tablist">
            </ul>
        </div>

        <div class="tab-content" id="mainTabsContent">
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="usageModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
          <div class="modal-header bg-primary text-white">
            <h5 class="modal-title" id="usageModalLabel">Utilisation du type</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="usageModalBody" style="font-size: 1.05em;">
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
